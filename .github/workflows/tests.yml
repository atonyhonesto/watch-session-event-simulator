name: tests

on:
  push:
  pull_request:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint with PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path ./send-wrestling-events.ps1 -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
      - name: Dry run the match
        shell: pwsh
        run: ./send-wrestling-events.ps1 -DryRun -SpeedMultiplier 120
